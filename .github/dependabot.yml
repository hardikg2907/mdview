version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
    ignore:
      # Node types must match the oldest Node in `engines`, or code could use APIs that runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/vscode
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # VS Code types must match `engines.vscode`, or the extension could call APIs older editors lack.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
